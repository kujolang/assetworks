name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  KUJO_COMMIT: 599866bef0beb042c07751b77aa538db7f1a696c
jobs:
  full-suite-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install openssl:x64-windows-static-md
      - run: cargo build --release --manifest-path .runtime/kujo/Cargo.toml
      - shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: bash scripts/validate.sh
