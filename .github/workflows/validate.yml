name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  KUJO_COMMIT: 66b9e3f787b24de875abbf939bc9e278b7a3e22e
jobs:
  full-suite-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          path: .runtime/kujo/target
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}
      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV
      - name: Enable Windows link fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg-full >/dev/null 2>&1 || brew install ffmpeg-full
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Filter ffprobe.exe -Recurse | Select-Object -First 1
          "FFMPEG_BIN=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "FFPROBE_BIN=$($ffprobe.FullName)" >> $env:GITHUB_ENV
      - name: Configure explicit FFmpeg binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "FFMPEG_BIN=$(brew --prefix ffmpeg-full)/bin/ffmpeg" >> "$GITHUB_ENV"
            echo "FFPROBE_BIN=$(brew --prefix ffmpeg-full)/bin/ffprobe" >> "$GITHUB_ENV"
          else
            echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
            echo "FFPROBE_BIN=$(command -v ffprobe)" >> "$GITHUB_ENV"
          fi
      - name: Verify runtime boundary contracts
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo test --release --locked --manifest-path .runtime/kujo/Cargo.toml --test native_api_security_boundaries sha256_beneath
          cargo test --release --locked --manifest-path .runtime/kujo/Cargo.toml --test native_api_security_boundaries copy_beneath
          cargo test --release --locked --manifest-path .runtime/kujo/Cargo.toml --test directory_page_contract
      # Integration tests build the CLI binary as well as the native contracts.
      # Preserve this verified runtime even if a later application test fails.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: .runtime/kujo/target
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}
      - shell: bash
        env:
          ASSETWORKS_REQUIRE_ADAPTER_TESTS: "1"
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: bash scripts/validate.sh
      - name: Measure large files and mixed/corrupt state
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for size in 68157440 1073741824 4294967296; do
            .runtime/kujo/target/release/kujo run scripts/streaming_benchmark.kujo -- "$size"
          done
          for count in 1000 10000 100000; do
            bash scripts/scale_benchmark.sh "$count"
          done
          .runtime/kujo/target/release/kujo run scripts/sharding_benchmark.kujo -- 100001
      - name: Verify real container isolation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -f containers/Dockerfile -t assetworks-ci:local .
          export DOCKER_BIN="$(command -v docker)"
          export ASSETWORKS_DOCKER_HOST=unix:///var/run/docker.sock
          export ASSETWORKS_CONTAINER_IMAGE="$(docker image inspect assetworks-ci:local --format '{{.Id}}')"
          .runtime/kujo/target/release/kujo run tests/isolation_test.kujo
